paths:
  raw_data: data/raw/telco-customer-churn.csv
  artifacts_dir: artifacts
  model_file: artifacts/model.joblib
  metrics_file: artifacts/metrics.json
  schema_file: artifacts/feature_schema.json
  eda_summary_file: artifacts/eda_summary.json

training:
  target_column: churn
  test_size: 0.15
  val_size: 0.15
  random_state: 42
  target_f1: 0.60
  optuna_trials: 100
  use_smote: true

serving:
  host: 0.0.0.0
  port: 8000
  api_base_url: http://localhost:8000

mcp:
  server_name: churn-engine
