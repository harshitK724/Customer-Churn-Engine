services:
  churn-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  churn-mcp:
    build: .
    command: python -m src.mcp_server.server
    environment:
      - PYTHONPATH=/app
      - API_BASE_URL=http://churn-api:8000
    depends_on:
      churn-api:
        condition: service_healthy
    stdin_open: true
    tty: true
